# SDD project configuration. Generated by sdd-init; keep context under 10 lines.
schema: spec-driven

context: |
  Project: Aprendiendo (workspace root, git repo mcvalenciah-prog/Aprendiendo, branch main)
  Stack: static HTML5/CSS3/JS site (pagina-web, Spanish UI) + Vite React TS app (pagina-web/react-profile)
  Projects in scope: pagina-web (static personal site, read-only data source); react-profile (React app, deployed entry point via root redirect)
  Architecture: static multi-file site; React SPA with relative base (./); JSON Schema contracts under pagina-web/contracts/review-integration (not part of the site runtime)
  Testing: Vitest + Testing Library for react-profile (npm test -- --run from pagina-web/react-profile); static site has no test runner
  Style: vanilla HTML/CSS/JS and React, Spanish UI copy; design tokens ported from pagina-web/styles.css
  Persistence: hybrid (OpenSpec files + Engram)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Strict TDD fails closed to false: no single workspace-level test command
# covers every in-scope project (static site has no runner). The react-profile
# project has its own Vitest command registered below; those local facts do not
# override the workspace-level fallback. Re-evaluate only if the static site
# gains a runner or a workspace-wide command appears.
strict_tdd: false

projects:
  - path: pagina-web
    stack: static HTML5/CSS3/JS (vanilla)
    test_command: ""
    test_framework: ""
    coverage_command: ""
    linter: ""
    type_checker: ""
    formatter: ""
  - path: pagina-web/react-profile
    stack: Vite React TS (SPA)
    test_command: "npm test -- --run"
    test_framework: vitest
    coverage_command: ""
    linter: ""
    type_checker: "tsc -b (npm run build)"
    formatter: ""

testing:
  strict_tdd: false
  detected: "2026-09-13"